name: Rust unit and smoke tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Execute local-only Rust tests
        run: python3 tests/reality_check_harness.py
